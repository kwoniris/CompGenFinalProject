## NEW VERSION FOR MAC!!!

name: pdac-scgpt
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.9
  
  # PyTorch (Mac specific - no CUDA)
  - pytorch
  - torchaudio
  - torchvision
  
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Single-cell analysis
  - scanpy>=1.9.0
  - anndata>=0.8.0
  
  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  
  # Additional packages
  - scikit-learn
  - umap-learn
  - h5py
  - tqdm
  
  # pip packages
  - pip
  - pip:
    - scgpt
    - harmonypy
    - scrublet
    - scvi-tools
