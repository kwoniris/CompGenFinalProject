# environment.yml for mac 

name: pdac-scgpt
channels:
  - conda-forge
  - bioconda
  - pytorch
  - defaults

dependencies:
  - python=3.9
  
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # PyTorch for Mac (MPS support)
  - pytorch::pytorch>=2.0.0
  - pytorch::torchaudio
  - pytorch::torchvision
  
  # Single-cell analysis
  - scanpy>=1.9.0
  - anndata>=0.8.0
  - scvi-tools
  - scrublet
  
  # Bioinformatics
  - bioconda::pybedtools
  - bioconda::pysam
  
  # Jupyter and development
  - jupyter
  - jupyterlab
  - ipykernel
  - notebook
  
  # Additional scientific packages
  - scikit-learn>=1.0.0
  - statsmodels
  - networkx
  - umap-learn
  - leidenalg
  - python-igraph
  
  # Data handling
  - h5py
  - tables
  - openpyxl
  - xlrd
  
  # Progress bars and utilities
  - tqdm
  - psutil
  
  # Plotting
  - plotly
  - bokeh
  
  # Development tools
  - black
  - flake8
  - pytest
  
  # pip packages that might not be available in conda
  - pip
  - pip:
    - scgpt
    - harmonypy # harmony for python 
    - gseapy
    - episcanpy
    - palantir
    - cellrank
    - squidpy
    - mudata
